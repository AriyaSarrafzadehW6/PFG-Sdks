name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: persiafava-java

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean compile
        
    - name: Test Sending SMS
      env:
        PERSIAFAVA_USER: "aria"
        PERSIAFAVA_PASS: "Aria!160"
        PERSIAFAVA_API_KEY: "509:689c4573af3d1"
      run: |
        cat << 'EOF' > src/main/java/com/persiafava/sms/TestApp.java
        package com.persiafava.sms;
        
        import java.util.Arrays;
        import java.time.ZonedDateTime;
        import java.time.ZoneId;
        import java.time.format.DateTimeFormatter;
        
        public class TestApp {
            public static void main(String[] args) {
                try {
                    Client client = new Client(
                        System.getenv("PERSIAFAVA_USER"),
                        System.getenv("PERSIAFAVA_PASS"),
                        System.getenv("PERSIAFAVA_API_KEY")
                    );
                    
                    ZonedDateTime now = ZonedDateTime.now(ZoneId.of("Asia/Tehran"));
                    String currentTime = now.format(DateTimeFormatter.ISO_OFFSET_DATE_TIME);
                    String message = "git test " + currentTime;

                    String response = client.sendSms(
                        Arrays.asList("09123117965"),
                        "300097500097",
                        message
                    );
                    
                    System.out.println("Sent message: " + message);
                    System.out.println("Success! Response: " + response);
                } catch (Exception e) {
                    System.err.println("Failed to send SMS: " + e.getMessage());
                    System.exit(1);
                }
            }
        }
        EOF
        # Recompile with the test app and run it
        mvn compile
        mvn exec:java -Dexec.mainClass="com.persiafava.sms.TestApp"