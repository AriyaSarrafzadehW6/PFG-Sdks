name: Ruby CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    
    defaults:
      run:
        working-directory: persiafava-ruby

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Install dependencies
      run: |
        bundle install
        gem install tzinfo
        
    - name: Test Complete SMS Chain
      env:
        PERSIAFAVA_USER: "aria"
        PERSIAFAVA_PASS: "Aria!160"
        PERSIAFAVA_API_KEY: "509:689c4573af3d1"
      run: |
        cat << 'EOF' > test_sms.rb
        require_relative 'lib/persiafava'
        require 'tzinfo'
        require 'net/http'
        require 'uri'
        require 'json'
        
        begin
          user = ENV['PERSIAFAVA_USER']
          pass = ENV['PERSIAFAVA_PASS']
          api_key = ENV['PERSIAFAVA_API_KEY']
          
          status_map = {
            "-1" => "پیام یافت نشد - احتمالاً آرشیو شده", "0" => "بدون وضعیت - در انتظار دریافت وضعیت",
            "1" => "رسیده به گوشی ✅", "2" => "نرسیده به گوشی ❌", "3" => "ارسال نشده به مخابرات",
            "4" => "ارسال شده به مخابرات", "5" => "لیست سیاه مخابرات (Blacklist)", "8" => "ارسال شده به اپراتور",
            "9" => "بازگشت هزینه به دلیل ترافیک مخابرات", "10" => "صف ارسال", "11" => "اسپم",
            "12" => "منقضی شده (Expired)", "13" => "بدون روت", "14" => "ریجکت شده",
            "16" => "نرسیده به مخابرات", "17" => "بدون وضعیت دلیوربیس"
          }
        
          # 1. User Info
          puts "--- Step 1: User Info ---"
          info_uri = URI('https://sms.persiafava.com/webservice/rest/user_info')
          info_res = Net::HTTP.post_form(info_uri, 'login_username' => user, 'login_password' => pass)
          puts "User Info: #{info_res.body}\n\n"
        
          # 2. SDK Send SMS
          puts "--- Step 2: Send SMS (via SDK) ---"
          client = PersiaFava::Client.new(username: user, password: pass, api_key: api_key)
          current_time = TZInfo::Timezone.get('Asia/Tehran').now.iso8601
          
          response = client.send_sms(to: ['09123117965'], sender: '300097500097', text: "git test #{current_time}")
          
          res_str = response.is_a?(String) ? response : response.to_json
          match = res_str.match(/"list"\s*:\s*\[\s*"([^"]+)"/)
          raise "Could not extract smsId from SDK response: #{res_str}" unless match
          
          sms_id = match[1]
          puts "SDK Response: #{res_str}\nExtracted SMS ID: #{sms_id}\n\n"
        
          # 3. Delivery Polling
          puts "--- Step 3: Polling Delivery ---"
          pending = ["0", "4", "10"]
          
          6.times do |i|
            sleep 5
            del_uri = URI("http://sms.persiafava.com/webservice/rest/sms_deliver?smsid[]=#{sms_id}&dargah=3000")
            del_res = JSON.parse(Net::HTTP.get(del_uri))
            
            code = (del_res.dig("list", sms_id) || "-99").to_s
            status_text = status_map[code] || "وضعیت ناشناخته"
            
            puts "Attempt #{i+1} -> Status for #{sms_id}: #{status_text} (Code: #{code})"
            
            if !pending.include?(code)
              puts "Final Status Reached. Chain Complete!"
              exit 0
            end
          end
          puts "Timeout waiting for final delivery status."
        rescue StandardError => e
          puts "Chain failed: #{e.message}"
          exit 1
        end
        EOF
        ruby test_sms.rb
