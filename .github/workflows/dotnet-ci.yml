name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: persiafava-dotnet

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x
        
    - name: Restore dependencies
      run: dotnet restore PersiaFava/PersiaFava.csproj
      
    - name: Build
      run: dotnet build PersiaFava/PersiaFava.csproj --no-restore
        
    - name: Test Complete SMS Chain
      env:
        PERSIAFAVA_USER: "aria"
        PERSIAFAVA_PASS: "Aria!160"
        PERSIAFAVA_API_KEY: "509:689c4573af3d1"
      run: |
        mkdir -p TestApp
        cd TestApp
        dotnet new console
        dotnet add reference ../PersiaFava/PersiaFava.csproj
        
        cat << 'EOF' > Program.cs
        using System;
        using System.Collections.Generic;
        using System.Net.Http;
        using System.Text.Json;
        using System.Text.RegularExpressions;
        using System.Threading.Tasks;
        using PersiaFava;
        
        namespace TestApp
        {
            class Program
            {
                static async Task Main(string[] args)
                {
                    string user = Environment.GetEnvironmentVariable("PERSIAFAVA_USER");
                    string pass = Environment.GetEnvironmentVariable("PERSIAFAVA_PASS");
                    string apiKey = Environment.GetEnvironmentVariable("PERSIAFAVA_API_KEY");
                    
                    var statusMap = new Dictionary<string, string> {
                        {"-1", "پیام یافت نشد - احتمالاً آرشیو شده"}, {"0", "بدون وضعیت - در انتظار دریافت وضعیت"},
                        {"1", "رسیده به گوشی ✅"}, {"2", "نرسیده به گوشی ❌"}, {"3", "ارسال نشده به مخابرات"},
                        {"4", "ارسال شده به مخابرات"}, {"5", "لیست سیاه مخابرات (Blacklist)"},
                        {"8", "ارسال شده به اپراتور"}, {"9", "بازگشت هزینه به دلیل ترافیک مخابرات"},
                        {"10", "صف ارسال"}, {"11", "اسپم"}, {"12", "منقضی شده (Expired)"},
                        {"13", "بدون روت"}, {"14", "ریجکت شده"}, {"16", "نرسیده به مخابرات"},
                        {"17", "بدون وضعیت دلیوربیس"}
                    };
                    
                    using var http = new HttpClient();
                    
                    try
                    {
                        // 1. Check User Info
                        Console.WriteLine("--- Step 1: User Info ---");
                        var form = new FormUrlEncodedContent(new[] { 
                            new KeyValuePair<string,string>("login_username", user), 
                            new KeyValuePair<string,string>("login_password", pass) 
                        });
                        var infoResStr = await http.PostAsync("https://sms.persiafava.com/webservice/rest/user_info", form).Result.Content.ReadAsStringAsync();
                        Console.WriteLine($"User API Response: {infoResStr}\n");
                        
                        // 2. Send SMS using SDK
                        Console.WriteLine("--- Step 2: Send SMS (via SDK) ---");
                        var client = new Client(user, pass, apiKey);
                        TimeZoneInfo tz = TimeZoneInfo.FindSystemTimeZoneById("Asia/Tehran");
                        string currentTime = TimeZoneInfo.ConvertTimeFromUtc(DateTime.UtcNow, tz).ToString("o");
                        string message = $"git test {currentTime}";

                        var response = await client.SendSmsAsync(new List<string> { "09123117965" }, "300097500097", message);
                        Console.WriteLine($"SDK Response: {response}");
                        
                        // Extract smsid dynamically (handles if SDK returned string or object)
                        string resStr = response is string s ? s : JsonSerializer.Serialize(response);
                        var match = Regex.Match(resStr, @"""list""\s*:\s*\[\s*""([^""]+)""");
                        
                        if (!match.Success) {
                            throw new Exception("Could not extract smsId from SDK response.");
                        }
                        string smsId = match.Groups[1].Value;
                        Console.WriteLine($"Extracted SMS ID: {smsId}\n");
                        
                        // 3. Delivery Polling
                        Console.WriteLine("--- Step 3: Polling Delivery ---");
                        var pendingStatuses = new List<string> { "0", "4", "10" };
                        
                        for(int i = 0; i < 6; i++) {
                            await Task.Delay(5000);
                            string delUrl = $"http://sms.persiafava.com/webservice/rest/sms_deliver?smsid[]={smsId}&dargah=3000";
                            string delStr = await http.GetStringAsync(delUrl);
                            
                            var delJson = JsonDocument.Parse(delStr);
                            string code = "-99";
                            try {
                                code = delJson.RootElement.GetProperty("list").GetProperty(smsId).GetString() ?? 
                                       delJson.RootElement.GetProperty("list").GetProperty(smsId).GetRawText();
                            } catch { } // fallback if format is slightly different
                            
                            string statusText = statusMap.ContainsKey(code) ? statusMap[code] : "وضعیت ناشناخته";
                            Console.WriteLine($"Attempt {i+1} -> Status for {smsId}: {statusText} (Code: {code})");
                            
                            if (!pendingStatuses.Contains(code)) {
                                Console.WriteLine("Final Status Reached. Chain Complete!");
                                return;
                            }
                        }
                        Console.WriteLine("Timeout waiting for final delivery status.");
                    }
                    catch (Exception ex)
                    {
                        Console.Error.WriteLine($"Chain failed: {ex.Message}");
                        Environment.Exit(1);
                    }
                }
            }
        }
        EOF
        
        dotnet run
