name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: persiafava-dotnet
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore PersiaFava/PersiaFava.csproj
    - name: Build
      run: dotnet build PersiaFava/PersiaFava.csproj --no-restore
    - name: Test Send / UserInfo / DeliveryStatus
      env:
        PERSIAFAVA_API_KEY: "509:689c4573af3d1"
      run: |
        mkdir -p TestApp
        cd TestApp
        dotnet new console
        dotnet add reference ../PersiaFava/PersiaFava.csproj

        cat << 'CSEOF' > Program.cs
        using System;
        using System.Collections.Generic;
        using System.Threading.Tasks;
        using PersiaFava;

        namespace TestApp
        {
            class Program
            {
                static async Task Main(string[] args)
                {
                    try
                    {
                        var client = new Client(Environment.GetEnvironmentVariable("PERSIAFAVA_API_KEY"));

                        string message = $"git test {DateTime.UtcNow:o}";
                        var sendResult = await client.SendSmsAsync(new List<string> { "09123117965" }, "300097500097", message);
                        Console.WriteLine("Send response: " + sendResult);

                        string smsid = null;
                        if (sendResult.TryGetValue("list", out var listObj) && listObj is System.Text.Json.JsonElement listEl && listEl.GetArrayLength() > 0)
                            smsid = listEl[0].ToString();

                        var userInfo = await client.UserInfo();
                        Console.WriteLine("UserInfo response: " + userInfo);

                        string dargah = "3000";
                        try
                        {
                            var numberEl = (System.Text.Json.JsonElement)userInfo["number"];
                            dargah = numberEl.GetProperty("list_user")[0].GetProperty("number").GetString();
                        }
                        catch { }

                        if (smsid != null)
                        {
                            var deliverResult = await client.DeliveryStatus(dargah, smsid);
                            Console.WriteLine("DeliveryStatus response: " + deliverResult);
                        }

                        Console.WriteLine("All calls completed.");
                    }
                    catch (Exception ex)
                    {
                        Console.Error.WriteLine("Failed: " + ex.Message);
                        Environment.Exit(1);
                    }
                }
            }
        }
        CSEOF

        dotnet run
