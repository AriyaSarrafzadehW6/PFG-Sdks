name: Delphi CI

on:
workflow_dispatch:

jobs:
test:
runs-on: self-hosted

defaults:
  run:
    working-directory: persiafava-delphi

steps:
- uses: actions/checkout@v3

- name: Test Complete SMS Chain (Raw cURL Fallback)
  env:
    PERSIAFAVA_USER: "aria"
    PERSIAFAVA_PASS: "Aria!160"
    PERSIAFAVA_API_KEY: "509:689c4573af3d1"
  run: |
    echo "=========================================================================="
    echo "WARNING: Delphi / Pascal code natively requires an Embarcadero Windows"
    echo "compiler (dcc32 / MSBuild). Since this is a Linux Ubuntu runner, we cannot"
    echo "easily compile the Delphi SDK here."
    echo ""
    echo "Executing the 3-step test chain using raw cURL to ensure your Iranian API"
    echo "and credentials are functioning flawlessly over this runner's network."
    echo "=========================================================================="
    echo ""
    
    # 1. User Info
    echo "--- Step 1: User Info ---"
    USER_INFO=$(curl -s -X POST "https://sms.persiafava.com/webservice/rest/user_info" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "login_username=$PERSIAFAVA_USER&login_password=$PERSIAFAVA_PASS")
    echo "User Info Response: $USER_INFO"
    echo ""
    
    # 2. Send SMS
    echo "--- Step 2: Send SMS (via API) ---"
    CURRENT_TIME=$(TZ='Asia/Tehran' date +'%Y-%m-%dT%H:%M:%S%z')
    MESSAGE="git test $CURRENT_TIME"
    
    SEND_RES=$(curl -s -X POST "http://sms.persiafava.com/webservice/rest/sms_send?note_arr[]=$CURRENT_TIME&api_key=$PERSIAFAVA_API_KEY&receiver_number=09123117965&sender_number=300097500097" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "text=$MESSAGE")
    
    echo "API Response: $SEND_RES"
    
    # Extract SMS ID
    SMS_ID=$(echo$SEND_RES | grep -o '"list" *: *\[ *"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"')
    
    if [ -z "$SMS_ID" ]; then
      echo "Failed to extract SMS ID from response."
      exit 1
    fi
    echo "Extracted SMS ID: $SMS_ID"
    echo ""
    
    # 3. Delivery Polling
    echo "--- Step 3: Polling Delivery ---"
    
    for i in {1..6}; do
      sleep 5
      DEL_RES=$(curl -s -X GET "http://sms.persiafava.com/webservice/rest/sms_deliver?smsid[]=$SMS_ID&dargah=3000")
      
      # Extract the exact numeric code mapping to that SMS_ID
      CODE=$(echo $DEL_RES \vert{} grep -o "\"$SMS_ID\" *: *\"*[0-9\-]*\"*" | awk -F':' '{print $2}' | tr -d '" ')
      
      if [ -z "$CODE" ]; then CODE="-99"; fi
      
      case $CODE in
        "-1") STATUS_TEXT="پیام یافت نشد - احتمالاً آرشیو شده" ;;
        "0") STATUS_TEXT="بدون وضعیت - در انتظار دریافت وضعیت" ;;
        "1") STATUS_TEXT="رسیده به گوشی ✅" ;;
        "2") STATUS_TEXT="نرسیده به گوشی ❌" ;;
        "3") STATUS_TEXT="ارسال نشده به مخابرات" ;;
        "4") STATUS_TEXT="ارسال شده به مخابرات" ;;
        "5") STATUS_TEXT="لیست سیاه مخابرات (Blacklist)" ;;
        "8") STATUS_TEXT="ارسال شده به اپراتور" ;;
        "9") STATUS_TEXT="بازگشت هزینه به دلیل ترافیک مخابرات" ;;
        "10") STATUS_TEXT="صف ارسال" ;;
        "11") STATUS_TEXT="اسپم" ;;
        "12") STATUS_TEXT="منقضی شده (Expired)" ;;
        "13") STATUS_TEXT="بدون روت" ;;
        "14") STATUS_TEXT="ریجکت شده" ;;
        "16") STATUS_TEXT="نرسیده به مخابرات" ;;
        "17") STATUS_TEXT="بدون وضعیت دلیوربیس" ;;
        *) STATUS_TEXT="وضعیت ناشناخته" ;;
      esac
      
      echo "Attempt $i -> Status for$SMS_ID: $STATUS_TEXT (Code:$CODE)"
      
      if [[ "$CODE" != "0" && "$CODE" != "4" && "$CODE" != "10" ]]; then
        echo "Final Status Reached. Chain Complete!"
        exit 0
      fi
    done
    
    echo "Timeout waiting for final delivery status."
