name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    
    defaults:
      run:
        working-directory: persiafava-node

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        
    - name: Install dependencies
      run: npm install
        
    - name: Test Complete SMS Chain
      env:
        PERSIAFAVA_USER: "aria"
        PERSIAFAVA_PASS: "Aria!160"
        PERSIAFAVA_API_KEY: "509:689c4573af3d1"
      run: |
        cat << 'EOF' > test_sms.js
        const PersiaFava = require('./src/client');
        
        async function runTest() {
            try {
                const user = process.env.PERSIAFAVA_USER;
                const pass = process.env.PERSIAFAVA_PASS;
                const apiKey = process.env.PERSIAFAVA_API_KEY;
                
                const statusMap = {
                    "-1": "پیام یافت نشد - احتمالاً آرشیو شده", "0": "بدون وضعیت - در انتظار دریافت وضعیت",
                    "1": "رسیده به گوشی ✅", "2": "نرسیده به گوشی ❌", "3": "ارسال نشده به مخابرات",
                    "4": "ارسال شده به مخابرات", "5": "لیست سیاه مخابرات (Blacklist)", "8": "ارسال شده به اپراتور",
                    "9": "بازگشت هزینه به دلیل ترافیک مخابرات", "10": "صف ارسال", "11": "اسپم",
                    "12": "منقضی شده (Expired)", "13": "بدون روت", "14": "ریجکت شده",
                    "16": "نرسیده به مخابرات", "17": "بدون وضعیت دلیوربیس"
                };

                // 1. User Info check
                console.log("--- Step 1: User Info ---");
                const infoRes = await fetch("https://sms.persiafava.com/webservice/rest/user_info", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ login_username: user, login_password: pass })
                }).then(r => r.json());
                console.log("User Info Response:", JSON.stringify(infoRes));
                console.log("");
                
                // 2. SDK Send SMS
                console.log("--- Step 2: Send SMS (via SDK) ---");
                const client = new PersiaFava({ username: user, password: pass, apiKey: apiKey });
                const current_time = new Date().toISOString();
                const message = `git test ${current_time}`;

                const response = await client.sendSms(["09123117965"], "300097500097", message);
                
                // Extract smsid dynamically
                const resStr = typeof response === 'object' ? JSON.stringify(response) : String(response);
                const match = resStr.match(/"list"\s*:\s*\[\s*"([^"]+)"/);
                if (!match) throw new Error("Could not extract smsId from SDK response: " + resStr);
                const smsId = match[1];
                
                console.log("SDK Response:", resStr);
                console.log("Extracted SMS ID:", smsId);
                console.log("");
                
                // 3. Delivery Polling
                console.log("--- Step 3: Polling Delivery ---");
                const pendingStatuses = ["0", "4", "10"];
                
                for(let i = 0; i < 6; i++) {
                    await new Promise(r => setTimeout(r, 5000));
                    const delRes = await fetch(`http://sms.persiafava.com/webservice/rest/sms_deliver?smsid[]=${smsId}&dargah=3000`).then(r => r.json());
                    
                    const code = String(delRes.list?.[smsId] || "-99");
                    const statusText = statusMap[code] || "وضعیت ناشناخته";
                    
                    console.log(`Attempt ${i+1} -> Status for ${smsId}: ${statusText} (Code: ${code})`);
                    
                    if (!pendingStatuses.includes(code)) {
                        console.log("Final Status Reached. Chain Complete!");
                        return;
                    }
                }
                console.log("Timeout waiting for final delivery status.");
            } catch (error) {
                console.error("Chain failed:", error);
                process.exit(1);
            }
        }
        
        runTest();
        EOF
        node test_sms.js
