name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: persiafava-node
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
    - name: Install dependencies
      run: npm install
    - name: Test Send / UserInfo / DeliveryStatus
      env:
        PERSIAFAVA_API_KEY: "509:689c4573af3d1"
      run: |
        cat << 'JSEOF' > test_sms.js
        const PersiaFavaClient = require('./src/client');

        async function runTest() {
            try {
                const client = new PersiaFavaClient(process.env.PERSIAFAVA_API_KEY);

                const message = `git test ${new Date().toISOString()}`;
                const sendResult = await client.sendSms(['09123117965'], '300097500097', message);
                console.log('Send response:', sendResult);
                const smsid = sendResult.list && sendResult.list[0];

                const userInfo = await client.userInfo();
                console.log('UserInfo response:', userInfo);
                const dargah = (userInfo.number && userInfo.number.list_user && userInfo.number.list_user[0] && userInfo.number.list_user[0].number) || '3000';

                if (smsid) {
                    const deliverResult = await client.deliveryStatus({ dargah, 'smsid[]': smsid });
                    console.log('DeliveryStatus response:', deliverResult);
                }
                console.log('All calls completed.');
            } catch (error) {
                console.error('Failed:', error.message || error);
                process.exit(1);
            }
        }

        runTest();
        JSEOF
        node test_sms.js
