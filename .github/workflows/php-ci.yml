name: PHP CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    
    defaults:
      run:
        working-directory: persiafava-php

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
        
    - name: Test Complete SMS Chain
      env:
        PERSIAFAVA_USER: "aria"
        PERSIAFAVA_PASS: "Aria!160"
        PERSIAFAVA_API_KEY: "509:689c4573af3d1"
      run: |
        cat << 'EOF' > test_sms.php
        <?php
        require_once __DIR__ . '/vendor/autoload.php';
        use PersiaFava\Client;
        
        try {
            $user = getenv('PERSIAFAVA_USER');
            $pass = getenv('PERSIAFAVA_PASS');
            $apiKey = getenv('PERSIAFAVA_API_KEY');
            
            $statusMap = [
                "-1" => "پیام یافت نشد - احتمالاً آرشیو شده", "0" => "بدون وضعیت - در انتظار دریافت وضعیت",
                "1" => "رسیده به گوشی ✅", "2" => "نرسیده به گوشی ❌", "3" => "ارسال نشده به مخابرات",
                "4" => "ارسال شده به مخابرات", "5" => "لیست سیاه مخابرات (Blacklist)", "8" => "ارسال شده به اپراتور",
                "9" => "بازگشت هزینه به دلیل ترافیک مخابرات", "10" => "صف ارسال", "11" => "اسپم",
                "12" => "منقضی شده (Expired)", "13" => "بدون روت", "14" => "ریجکت شده",
                "16" => "نرسیده به مخابرات", "17" => "بدون وضعیت دلیوربیس"
            ];
        
            // 1. User Info
            echo "--- Step 1: User Info ---\n";
            $opts = ['http' => ['method' => 'POST', 'header' => 'Content-Type: application/x-www-form-urlencoded', 
                     'content' => http_build_query(['login_username' => $user, 'login_password' => $pass])]];
            $infoRes = file_get_contents("https://sms.persiafava.com/webservice/rest/user_info", false, stream_context_create($opts));
            echo "User Info: " . $infoRes . "\n\n";
            
            // 2. SDK Send SMS
            echo "--- Step 2: Send SMS (via SDK) ---\n";
            $client = new Client($user, $pass, $apiKey);
            $current_time = (new DateTime('now', new DateTimeZone('Asia/Tehran')))->format('c');
            $message = "git test " . $current_time;
        
            $response = $client->sendSms(['09123117965'], '300097500097', $message);
            $resStr = (is_array($response) || is_object($response)) ? json_encode($response) : (string)$response;
            
            if (!preg_match('/"list"\s*:\s*\[\s*"([^"]+)"/', $resStr, $matches)) {
                throw new Exception("Could not extract smsId from SDK response: " . $resStr);
            }
            $smsId = $matches[1];
            echo "SDK Response: " . $resStr . "\nExtracted SMS ID: " . $smsId . "\n\n";
            
            // 3. Delivery Polling
            echo "--- Step 3: Polling Delivery ---\n";
            $pending = ["0", "4", "10"];
            
            for ($i = 0; $i < 6; $i++) {
                sleep(5);
                $delStr = file_get_contents("http://sms.persiafava.com/webservice/rest/sms_deliver?smsid[]=" . $smsId . "&dargah=3000");
                $delArr = json_decode($delStr, true);
                
                $code = (string)($delArr['list'][$smsId] ?? "-99");
                $statusText = $statusMap[$code] ?? "وضعیت ناشناخته";
                
                echo "Attempt " . ($i+1) . " -> Status for $smsId: $statusText (Code: $code)\n";
                
                if (!in_array($code, $pending)) {
                    echo "Final Status Reached. Chain Complete!\n";
                    exit(0);
                }
            }
            echo "Timeout waiting for final delivery status.\n";
        } catch (\Exception $e) {
            echo "Chain failed: " . $e->getMessage() . "\n";
            exit(1);
        }
        EOF
        php test_sms.php
